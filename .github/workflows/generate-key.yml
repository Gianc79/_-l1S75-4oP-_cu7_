name: Genera Chiave Fissa SpesaSuMisura

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Genera keystore e base64
        run: |
          keytool -genkey -v -keystore spesasumisura-debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          base64 -w 0 spesasumisura-debug.keystore > chiave_base64.txt

      - name: Scarica chiave e stringa Base64
        uses: actions/upload-artifact@v4
        with:
          name: Chiave-Fissa-SpesaSuMisura
          path: |
            spesasumisura-debug.keystore
            chiave_base64.txt
