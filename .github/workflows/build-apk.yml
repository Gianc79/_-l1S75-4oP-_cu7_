name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica codice dal repository
        uses: actions/checkout@v5

      - name: Configura Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Configura Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installa dipendenze e compila web app
        run: |
          npm install
          npm run build

      - name: Genera progetto Android, icone e schermo intero immersivo
        run: |
          npx cap add android
          if [ -f "icon-512.png" ]; then
            mkdir -p resources
            cp icon-512.png resources/icon.png
            npx --yes @capacitor/assets generate --android
          fi
          cat << 'EOF' > android/app/src/main/java/it/spesasumisura/app/BackupSaverPlugin.java
          package it.spesasumisura.app;

          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import androidx.activity.result.ActivityResult;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.ActivityCallback;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;

          @CapacitorPlugin(name = "BackupSaver")
          public class BackupSaverPlugin extends Plugin {
              private boolean isSaving = false;

              @Override
              protected Bundle saveInstanceState() {
                  return new Bundle();
              }

              @PluginMethod
              public void saveFile(PluginCall call) {
                  if (isSaving) {
                      call.reject("Salvataggio gi\u00e0 in corso.");
                      return;
                  }
                  String fileName = call.getString("fileName", "spesasumisura-backup.json");
                  String mimeType = call.getString("mimeType", "application/json");
                  String sourcePath = call.getString("sourcePath", "");
                  if (sourcePath == null || sourcePath.isEmpty()) {
                      call.reject("Percorso temporaneo del backup mancante.");
                      return;
                  }
                  File sourceFile = resolveCacheFile(sourcePath);
                  if (!sourceFile.exists() || !sourceFile.isFile()) {
                      call.reject("File temporaneo del backup non trovato.");
                      return;
                  }
                  Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                  intent.addCategory(Intent.CATEGORY_OPENABLE);
                  intent.setType(mimeType);
                  intent.putExtra(Intent.EXTRA_TITLE, fileName);
                  intent.addFlags(Intent.FLAG_GRANT_WRITE_URI_PERMISSION | Intent.FLAG_GRANT_READ_URI_PERMISSION);
                  isSaving = true;
                  try {
                      startActivityForResult(call, intent, "handleSaveFileResult");
                  } catch (ActivityNotFoundException e) {
                      isSaving = false;
                      deleteQuietly(sourceFile);
                      call.reject("Nessun selettore file disponibile sul dispositivo.");
                  } catch (Throwable t) {
                      isSaving = false;
                      deleteQuietly(sourceFile);
                      call.reject("Impossibile aprire la finestra di salvataggio: " + safeMsg(t));
                  }
              }

              @ActivityCallback
              private void handleSaveFileResult(PluginCall call, ActivityResult result) {
                  isSaving = false;
                  if (call == null) {
                      return;
                  }
                  String sourcePath = call.getString("sourcePath", "");
                  File sourceFile = resolveCacheFile(sourcePath);
                  if (result == null || result.getResultCode() != Activity.RESULT_OK || result.getData() == null) {
                      deleteQuietly(sourceFile);
                      JSObject cancelled = new JSObject();
                      cancelled.put("saved", false);
                      cancelled.put("cancelled", true);
                      call.resolve(cancelled);
                      return;
                  }
                  Uri uri = result.getData().getData();
                  if (uri == null) {
                      deleteQuietly(sourceFile);
                      JSObject cancelled = new JSObject();
                      cancelled.put("saved", false);
                      cancelled.put("cancelled", true);
                      call.resolve(cancelled);
                      return;
                  }
                  execute(() -> {
                      try {
                          if (!sourceFile.exists() || !sourceFile.isFile()) {
                              call.reject("File temporaneo del backup non trovato.");
                              return;
                          }
                          OutputStream os = openTargetStream(uri);
                          try (InputStream in = new FileInputStream(sourceFile); OutputStream out = os) {
                              byte[] buffer = new byte[16384];
                              int read;
                              while ((read = in.read(buffer)) != -1) {
                                  out.write(buffer, 0, read);
                              }
                              out.flush();
                          }
                          JSObject ret = new JSObject();
                          ret.put("saved", true);
                          ret.put("cancelled", false);
                          ret.put("uri", uri.toString());
                          call.resolve(ret);
                      } catch (Throwable t) {
                          call.reject("Errore durante il salvataggio: " + safeMsg(t));
                      } finally {
                          deleteQuietly(sourceFile);
                      }
                  });
              }

              private OutputStream openTargetStream(Uri uri) throws IOException {
                  try {
                      OutputStream os = getContext().getContentResolver().openOutputStream(uri, "wt");
                      if (os != null) {
                          return os;
                      }
                  } catch (Throwable ignored) {
                      // Alcuni provider supportano solo la modalita "w"
                  }
                  OutputStream os = getContext().getContentResolver().openOutputStream(uri, "w");
                  if (os == null) {
                      throw new IOException("Impossibile aprire il file di destinazione.");
                  }
                  return os;
              }

              private File resolveCacheFile(String sourcePath) {
                  String safeName = new File(sourcePath == null ? "" : sourcePath).getName();
                  return new File(getContext().getCacheDir(), safeName);
              }

              private void deleteQuietly(File file) {
                  try {
                      if (file != null && file.exists()) {
                          file.delete();
                      }
                  } catch (Throwable ignored) {
                  }
              }

              private String safeMsg(Throwable t) {
                  if (t == null) {
                      return "errore sconosciuto";
                  }
                  String m = t.getMessage();
                  return (m != null && !m.isEmpty()) ? m : t.getClass().getSimpleName();
              }
          }
          EOF
          cat << 'EOF' > android/app/src/main/java/it/spesasumisura/app/MainActivity.java
          package it.spesasumisura.app;

          import android.os.Bundle;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  registerPlugin(BackupSaverPlugin.class);
                  super.onCreate(savedInstanceState);
                  hideSystemBars();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      hideSystemBars();
                  }
              }

              private void hideSystemBars() {
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                  WindowInsetsControllerCompat controller =
                      WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                  if (controller != null) {
                      controller.hide(WindowInsetsCompat.Type.systemBars());
                      controller.setSystemBarsBehavior(
                          WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                      );
                  }
              }
          }
          EOF
          npx cap sync android

      - name: Compila APK Android con chiave fissa
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/fixed-debug.keystore
          keytool -list -keystore android/app/fixed-debug.keystore -storepass android
          cat << 'EOF' >> android/app/build.gradle

          android {
              signingConfigs {
                  debug {
                      storeFile file('fixed-debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          }
          EOF
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Carica APK scaricabile
        uses: actions/upload-artifact@v5
        with:
          name: SpesaSuMisura-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
