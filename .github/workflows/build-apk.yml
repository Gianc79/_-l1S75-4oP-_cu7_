name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica codice dal repository
        uses: actions/checkout@v5

      - name: Configura Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installa dipendenze e compila web app
        run: |
          npm install
          npm run build

      - name: Genera progetto Android, icone e schermo intero immersivo
        run: |
          npx cap add android
          if [ -f "icon-512.png" ]; then
            mkdir -p resources
            cp icon-512.png resources/icon.png
            npx --yes @capacitor/assets generate --android
          fi
          cat << 'EOF' > android/app/src/main/java/it/spesasumisura/app/BackupSaverPlugin.java
          package it.spesasumisura.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import androidx.activity.result.ActivityResult;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.ActivityCallback;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;

          @CapacitorPlugin(name = "BackupSaver")
          public class BackupSaverPlugin extends Plugin {
              @PluginMethod
              public void saveFile(PluginCall call) {
                  String fileName = call.getString("fileName", "spesasumisura-backup.json");
                  String mimeType = call.getString("mimeType", "application/json");
                  String content = call.getString("content");
                  if (content == null) {
                      call.reject("Contenuto del backup mancante.");
                      return;
                  }
                  Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                  intent.addCategory(Intent.CATEGORY_OPENABLE);
                  intent.setType(mimeType);
                  intent.putExtra(Intent.EXTRA_TITLE, fileName);
                  startActivityForResult(call, intent, "handleSaveFileResult");
              }

              @ActivityCallback
              public void handleSaveFileResult(PluginCall call, ActivityResult result) {
                  if (call == null) {
                      return;
                  }
                  if (result == null || result.getResultCode() != Activity.RESULT_OK || result.getData() == null) {
                      JSObject cancelled = new JSObject();
                      cancelled.put("saved", false);
                      cancelled.put("cancelled", true);
                      call.resolve(cancelled);
                      return;
                  }
                  Uri uri = result.getData().getData();
                  if (uri == null) {
                      JSObject cancelled = new JSObject();
                      cancelled.put("saved", false);
                      cancelled.put("cancelled", true);
                      call.resolve(cancelled);
                      return;
                  }
                  String content = call.getString("content", "");
                  try {
                      OutputStream os = null;
                      try {
                          os = getContext().getContentResolver().openOutputStream(uri, "wt");
                      } catch (IllegalArgumentException | UnsupportedOperationException ignored) {
                          os = getContext().getContentResolver().openOutputStream(uri, "w");
                      }
                      if (os == null) {
                          call.reject("Impossibile aprire il file di destinazione.");
                          return;
                      }
                      try (OutputStream out = os) {
                          out.write(content.getBytes(StandardCharsets.UTF_8));
                          out.flush();
                      }
                      JSObject ret = new JSObject();
                      ret.put("saved", true);
                      ret.put("cancelled", false);
                      ret.put("uri", uri.toString());
                      call.resolve(ret);
                  } catch (Exception e) {
                      call.reject("Errore durante il salvataggio: " + e.getMessage(), e);
                  }
              }
          }
          EOF
          cat << 'EOF' > android/app/src/main/java/it/spesasumisura/app/MainActivity.java
          package it.spesasumisura.app;

          import android.os.Bundle;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  registerPlugin(BackupSaverPlugin.class);
                  super.onCreate(savedInstanceState);
                  hideSystemBars();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      hideSystemBars();
                  }
              }

              private void hideSystemBars() {
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                  WindowInsetsControllerCompat controller =
                      WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                  if (controller != null) {
                      controller.hide(WindowInsetsCompat.Type.systemBars());
                      controller.setSystemBarsBehavior(
                          WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                      );
                  }
              }
          }
          EOF
          npx cap sync android

      - name: Compila APK Android con chiave fissa
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/fixed-debug.keystore
          keytool -list -keystore android/app/fixed-debug.keystore -storepass android
          cat << 'EOF' >> android/app/build.gradle

          android {
              signingConfigs {
                  debug {
                      storeFile file('fixed-debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          }
          EOF
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Carica APK scaricabile
        uses: actions/upload-artifact@v5
        with:
          name: SpesaSuMisura-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
