<html lang="it">
<head>

<style>
:root{
  --green:#176b55;--green-dark:#10513f;--green-soft:#e8f4ef;--bg:#f5f7f6;
  --surface:#fff;--text:#17211e;--muted:#68756f;--line:#e0e7e3;--danger:#b42318;
  --shadow:0 8px 28px rgba(18,48,37,.10);--radius:16px;
}
*{box-sizing:border-box}
/* Scrollbar larghezza raddoppiata (~22px) */
*::-webkit-scrollbar{width:22px;height:22px}
*::-webkit-scrollbar-track{background:rgba(23,79,134,.08);border-radius:11px}
*::-webkit-scrollbar-thumb{background:#547192;border-radius:11px;border:3px solid transparent;background-clip:padding-box;min-height:54px}
*::-webkit-scrollbar-thumb:hover{background:#3a5474;border:3px solid transparent;background-clip:padding-box}
html{scrollbar-width:auto;scrollbar-color:#547192 rgba(23,79,134,.08)}

html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:var(--bg)}
body{padding-bottom:calc(82px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #86c9b4;outline-offset:2px}
.app-header{position:sticky;top:0;z-index:10;background:var(--green-soft);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 12px 10px}
.header-row{display:flex;align-items:center;gap:10px;max-width:760px;margin:auto}
.brand{font-size:19px;font-weight:850;letter-spacing:-.4px}.brand-box{background:#fff;border-radius:14px;padding:9px 12px;display:flex;align-items:center;justify-content:center;min-width:0;flex:1}.header-title-wrap{min-width:0}.header-actions{display:flex;gap:7px;flex:0 0 auto}
.tagline{font-size:11px;color:var(--muted);margin-top:1px}.header-icon{width:40px;height:40px;border:0;background:#fff;border-radius:12px;font-size:20px;color:var(--green);display:grid;place-items:center}.header-icon:active{background:#e7f0ec}.header-icon svg{width:23px;height:23px}
.icon-button{width:42px;height:42px;border:0;background:#f0f5f2;border-radius:13px;font-size:22px;color:var(--green)}
main{max-width:760px;margin:0 auto;padding:16px 14px 24px}
h1{font-size:25px;line-height:1.2;margin:2px 0 16px;letter-spacing:-.5px}
h2{font-size:18px;margin:22px 0 10px}
h3{font-size:14px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:22px 4px 8px}
p{line-height:1.5}
.muted{color:var(--muted)}.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:6px;margin:0 0 15px}
.field label{font-weight:650;font-size:14px}
input[type=text],input[type=number],input[type=search],select{width:100%;min-height:46px;padding:10px 12px;border:1px solid #cbd6d0;border-radius:11px;background:#fff;color:var(--text)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--green);flex:0 0 auto}
.btn{border:0;border-radius:12px;padding:12px 16px;min-height:46px;font-weight:750;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn-primary{background:var(--green);color:white}.btn-primary:active{background:var(--green-dark)}
.btn-secondary{background:var(--green-soft);color:var(--green-dark)}
.btn-navigation{background:#dcecff;color:#24527a}.btn-navigation:active{background:#c9e0fb}
.btn-plain{background:#eef2ef;color:var(--text)}
.btn-danger{background:#fff0ef;color:var(--danger)}
.btn-block{width:100%}.btn-small{min-height:36px;padding:8px 11px;font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap}.actions>*{flex:1}
.search-wrap{margin-bottom:12px}.products-search-sticky{position:sticky;top:73px;z-index:7;background:var(--bg);padding:8px 0 10px;margin-top:-8px}.scroll-top-btn{position:fixed;right:16px;bottom:calc(125px + env(safe-area-inset-bottom));z-index:12;width:48px;height:48px;border:0;border-radius:14px;background:var(--green);color:#fff;font-size:25px;font-weight:800;box-shadow:var(--shadow);display:none}.scroll-top-btn.visible{display:grid;place-items:center}
.list-row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:8px;min-height:68px}
.item-check{width:46px;height:46px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:#f2f6f3;flex:0 0 46px}
.item-check input{width:25px;height:25px}
.row-main{min-width:0;flex:1;align-self:stretch;display:flex;flex-direction:column;justify-content:center;cursor:pointer}
.row-name{font-weight:750;overflow-wrap:anywhere}
.row-sub{font-size:13px;color:var(--muted);margin-top:4px}
.row-price{font-size:14px;font-weight:750;text-align:right;white-space:nowrap;align-self:center;margin-left:auto;flex:0 0 auto;display:flex;justify-content:flex-end}
.list-row.checked .row-main,.list-row.checked .row-price{opacity:.52}
.list-row.checked .row-name{font-weight:600}
.category-heading{margin:20px 4px 8px;font-size:12px;letter-spacing:.8px;color:var(--green-dark);font-weight:850;text-transform:uppercase}
.empty{padding:24px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed #cbd6d0;border-radius:15px;line-height:1.5}
.sticky-list-footer{position:fixed;z-index:9;bottom:calc(65px + env(safe-area-inset-bottom));left:0;right:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:10px 14px;backdrop-filter:blur(12px)}
.footer-inner{max-width:730px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.total-label{font-size:12px;color:var(--muted)}.total-value{font-size:19px;font-weight:850}.total-progress{font-size:13px;color:var(--muted);font-weight:650}.total-progress-sep{font-size:13px;color:var(--muted);font-weight:500}.total-missing{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
.counter{font-size:13px;font-weight:800;color:var(--green-dark);background:var(--green-soft);padding:8px 10px;border-radius:10px;white-space:nowrap}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:11;display:grid;grid-template-columns:repeat(4,1fr);background:white;border-top:1px solid var(--line);padding:7px 5px calc(7px + env(safe-area-inset-bottom))}
.nav-btn{border:0;background:transparent;color:var(--muted);padding:6px 2px 4px;border-radius:12px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:650}
.nav-btn .nav-icon{font-size:21px;line-height:1.1}.nav-btn.active{color:var(--green);background:var(--green-soft)}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.toolbar h1{margin:0}
.product-meta{font-size:13px;color:var(--muted);margin-top:3px}
.row-button{border:0;background:transparent;text-align:left;padding:0;min-width:0;flex:1;color:inherit}
.route-row{display:flex;align-items:center;gap:10px;padding:8px 10px;background:white;border:1px solid var(--line);border-radius:13px;margin-bottom:8px;position:relative;user-select:none;touch-action:pan-y;transition:box-shadow .15s,transform .15s,opacity .15s}.route-row.dragging{z-index:40;box-shadow:0 16px 34px rgba(18,48,37,.22);transform:scale(1.025);opacity:.96;touch-action:none}.route-row.placeholder{border:2px dashed #9ab5aa;background:#f2f7f4;min-height:58px}.route-check{width:44px;height:44px;display:grid;place-items:center;flex:0 0 44px}.route-check input{width:22px;height:22px}.route-name{font-weight:700;flex:1;min-width:0;padding:10px 4px}.copy-icon{width:42px;height:42px;display:grid;place-items:center;border:0;border-radius:11px;background:#e8f4ef;color:var(--green);flex:0 0 42px}.copy-icon svg{width:23px;height:23px}.store-modal-title{display:flex;align-items:center;gap:8px}.store-modal-title .copy-icon{margin-left:auto}

.check-line{display:flex;align-items:center;gap:10px;padding:10px 2px;min-height:45px}
.check-line label{flex:1}
.section-label{font-size:12px;font-weight:850;letter-spacing:.7px;color:var(--muted);margin:20px 2px 8px}
details.menu{position:relative}
details.menu summary{list-style:none;cursor:pointer;border-radius:12px;background:#eef3f0;width:42px;height:42px;display:grid;place-items:center;font-size:22px}
details.menu summary::-webkit-details-marker{display:none}
.menu-pop{position:absolute;right:0;top:47px;z-index:8;min-width:190px;background:white;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:12px;padding:6px}
.menu-pop button{display:block;width:100%;text-align:left;padding:12px;border:0;background:white;border-radius:8px}
.menu-pop button:active{background:var(--green-soft)}
.modal-backdrop{position:fixed;inset:0;background:rgba(14,27,21,.48);z-index:30;display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal{background:white;border-radius:22px 22px 0 0;width:100%;max-width:600px;max-height:90dvh;overflow:auto;padding:22px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:var(--shadow)}
.modal-header{display:flex;align-items:center;gap:10px;margin:0 0 16px}.modal-header h2{margin:0;font-size:22px;line-height:1.2;flex:1}.modal-close{width:40px;height:40px;flex:0 0 40px;border:0;border-radius:11px;background:#eef2ef;color:var(--text);font-size:25px;line-height:1;display:grid;place-items:center}.modal-close:active{background:#dfe7e2}
.modal h2{margin:0 0 16px;font-size:22px}
.modal-actions{display:flex;gap:9px;margin-top:18px}.modal-actions button{flex:1}
.toast{position:fixed;z-index:50;left:50%;bottom:calc(145px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#17211e;color:white;padding:12px 16px;border-radius:12px;max-width:90%;box-shadow:var(--shadow);font-size:14px}
.hidden{display:none!important}
.money-celebration{text-align:center;padding:10px 4px 4px}
.money-art{line-height:1.2;animation:cartBounce .8s ease-in-out infinite alternate}.cart-art{width:150px;height:115px;display:inline-block}
.celebrate-title{font-size:28px;font-weight:900;color:var(--green);margin:12px 0 6px}
.celebrate-sub{color:var(--muted);font-size:15px;line-height:1.4}
@keyframes cartBounce{from{transform:translateY(2px)}to{transform:translateY(-5px)}}
@keyframes runnerMove{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(2px,-3px) rotate(-1deg)}}
@keyframes wheelSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes motionFade{0%,100%{opacity:.25;transform:translateX(0)}50%{opacity:1;transform:translateX(-5px)}}
.runner{transform-origin:70px 100px;animation:runnerMove .55s ease-in-out infinite}.cart{transform-origin:190px 110px;animation:cartBounce .55s ease-in-out infinite alternate}.motion-line{transform-origin:25px 55px;animation:motionFade .7s ease-in-out infinite}
.inline-note{padding:11px 12px;background:#f0f6f2;border-radius:10px;font-size:13px;color:#375348;margin:10px 0}
.qty-row{display:flex;align-items:center;gap:8px}
.qty-row button{height:44px;width:44px;border:0;border-radius:11px;background:var(--green-soft);color:var(--green-dark);font-size:22px;font-weight:800}
.qty-row input{flex:1;text-align:center}
.price-input{max-width:180px}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}

@media(max-width:619px){
  .modal-backdrop.keyboard-open{align-items:flex-start;padding-top:max(12px,env(safe-area-inset-top));overflow:auto}
  .modal-backdrop.keyboard-open .modal{max-height:calc(100dvh - 24px);border-radius:20px;margin-bottom:12px}
}
@media(min-width:620px){
  body{padding-bottom:78px}.app-header{padding-top:14px}
  .sticky-list-footer{bottom:70px;left:50%;right:auto;transform:translateX(-50%);width:min(100%,760px);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0}
  .bottom-nav{left:50%;right:auto;transform:translateX(-50%);width:min(100%,760px);border-radius:16px 16px 0 0}
  .modal-backdrop{align-items:center;padding:18px}.modal{border-radius:22px;padding-bottom:22px}
}

.store-filter-wrap{position:relative}.store-filter-trigger{width:100%;min-height:46px;padding:10px 12px;border:1px solid #cbd6d0;border-radius:11px;background:#fff;color:var(--text);display:flex;align-items:center;justify-content:space-between;text-align:left}.store-filter-chevron{font-size:18px;margin-left:8px}.store-filter-menu{position:absolute;left:0;right:0;top:calc(100% + 5px);z-index:25;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:7px;max-height:55vh;overflow:auto}.filter-all-row{font-weight:800;border-bottom:1px solid var(--line);margin-bottom:4px}.already-in-list{opacity:.45;cursor:default}.already-in-list .add-product-plus{display:none}.row-trash{border:0;background:transparent;color:var(--danger);font-size:20px;line-height:1;min-width:42px;min-height:42px;display:grid;place-items:center;padding:0;flex:0 0 42px}.store-category-add{margin:10px 0 14px}.store-category-copy{display:flex;align-items:center;justify-content:flex-start;gap:8px;margin:4px 0 14px}.store-category-copy svg{width:24px;height:24px;flex:0 0 24px}.route-row.dragging{touch-action:none;box-shadow:0 16px 34px rgba(18,48,37,.28);transform:scale(1.025)}

function customDropdown(id,selectedId,options,includeNone=true,inline=false,searchable=false){

}

 menu.querySelectorAll('[data-dropdown-id]').forEach(option=>option.addEventListener('click',e=>{e.stopPropagation();field.value=option.dataset.value;const label=$(`#${id}Label`);if(label){label.textContent=option.dataset.label;label.classList.toggle('it',option.dataset.value==='__none__')}menu.querySelectorAll('.custom-dropdown-option').forEach(x=>{const selected=x===option;x.classList.toggle('selected',selected);x.setAttribute('aria-selected',String(selected))});menu.hidden=true;trigger.setAttribute('aria-expanded','false');field.dispatchEvent(new Event('change',{bubbles:true}))}));

async function saveProductForm(productId,returnPage,returnCategoryId=null){
 const name=$('#prodName').value.trim(),categoryId=$('#prodCategory').value,unitRaw=$('#prodUnit').value,unit=unitRaw==='l'?'lt':unitRaw;

 for(const sid of selected){const v=$('#price-'+sid)?.value??'',amount=eurosFromInput(v);if(Number.isNaN(amount)){showToast('Controlla il prezzo inserito.');return}if(amount!==null)priceRecords.push({storeId:sid,amountMinor:amount})}

 const existingAssociations=await getAll('productStores'),existingPrices=await getAll('productPrices');
 const tx=db.transaction(['products','productStores','productPrices'],'readwrite');tx.objectStore('products').put(prod);
 const ps=tx.objectStore('productStores'),pp=tx.objectStore('productPrices');
 for(const x of existingAssociations)if(x.productId===prod.id)ps.delete(x.id);
 for(const x of existingPrices)if(x.productId===prod.id)pp.delete(x.id);
 for(const sid of selected)ps.put({id:uuid(),productId:prod.id,storeId:sid,createdAt:now()});
 for(const pr of priceRecords)pp.put({id:uuid(),productId:prod.id,storeId:pr.storeId,amountMinor:pr.amountMinor,currency:'EUR',updatedAt:now()});
 await txDone(tx);closeModal(false);
 if(returnPage==='editor'){await productReturnFn();showToast('Articolo salvato')}

async function deleteProduct(productId,returnCategoryId=null){
 const [associations,prices,items]=await Promise.all([getAll('productStores'),getAll('productPrices'),getAll('shoppingListItems')]);
 const tx=db.transaction(['products','productStores','productPrices','shoppingListItems','tombstones'],'readwrite');
 tx.objectStore('products').delete(productId);
 for(const x of associations)if(x.productId===productId)tx.objectStore('productStores').delete(x.id);
 for(const x of prices)if(x.productId===productId)tx.objectStore('productPrices').delete(x.id);
 for(const x of items)if(x.productId===productId)tx.objectStore('shoppingListItems').delete(x.id);
 tx.objectStore('tombstones').put({id:uuid(),entityType:'product',entityId:productId,deletedAt:now(),revision:Date.now()});
 await txDone(tx);
 if(returnCategoryId){await openCategoryForm(returnCategoryId)}else{page='products';await render()}
 showToast('Articolo eliminato');
}

function bindCategoryDrag(list,onReorder){
 list.querySelectorAll('[data-route]').forEach(row=>{
   const handle=row.querySelector('[data-drag-handle]');if(!handle)return;
   let timer=null,drag=null,placeholder=null,pointerId=null,startX=0,startY=0,currentY=0,autoFrame=null,initialBodyOverflow='',dragLeft=0,grabY=0;
   const panel=()=>$('#modalRoot .modal');
   const stopAuto=()=>{if(autoFrame!==null){cancelAnimationFrame(autoFrame);autoFrame=null}};
   const currentOrder=()=>[...list.querySelectorAll('[data-route]')].map(x=>x.dataset.route);
   const clearStyles=el=>{if(!el)return;el.classList.remove('dragging');for(const prop of ['position','left','top','width','height','zIndex','pointerEvents','margin'])el.style[prop]=''};
   const cleanup=restore=>{
     clearTimeout(timer);timer=null;stopAuto();
     if(drag&&placeholder?.parentNode&&restore){placeholder.parentNode.insertBefore(drag,placeholder);placeholder.remove();onReorder(currentOrder())}
     clearStyles(drag);placeholder?.remove();placeholder=null;drag=null;document.body.style.overflow=initialBodyOverflow;
   };
   const autoScroll=()=>{
     if(!drag){autoFrame=null;return}
     const p=panel();if(p){const r=p.getBoundingClientRect(),edge=70;let d=0;if(currentY<r.top+edge)d=-Math.min(13,Math.max(2,(r.top+edge-currentY)/3));else if(currentY>r.bottom-edge)d=Math.min(13,Math.max(2,(currentY-(r.bottom-edge))/3));if(d)p.scrollTop=Math.max(0,Math.min(p.scrollHeight-p.clientHeight,p.scrollTop+d))}
     autoFrame=requestAnimationFrame(autoScroll);
   };
   handle.addEventListener('pointerdown',e=>{
     if(e.button!==0)return;startX=e.clientX;startY=currentY=e.clientY;pointerId=e.pointerId;try{handle.setPointerCapture(pointerId)}catch(_){ }
     clearTimeout(timer);
     timer=setTimeout(()=>{
       if(!row.isConnected)return;drag=row;const r=row.getBoundingClientRect();dragLeft=r.left;grabY=currentY-r.top;
       placeholder=document.createElement('div');placeholder.className='route-row placeholder';placeholder.style.height=r.height+'px';placeholder.style.marginBottom=getComputedStyle(row).marginBottom;
       row.parentNode.insertBefore(placeholder,row.nextSibling);
       try{handle.setPointerCapture(pointerId)}catch(_){ }
       row.style.width=r.width+'px';row.style.height=r.height+'px';row.style.margin='0';row.style.position='fixed';row.style.left=r.left+'px';row.style.top=r.top+'px';row.style.zIndex='100';row.style.pointerEvents='none';row.classList.add('dragging');
       initialBodyOverflow=document.body.style.overflow;document.body.style.overflow='hidden';autoFrame=requestAnimationFrame(autoScroll);
     },180);
     e.preventDefault();
   },{passive:false});
   handle.addEventListener('pointermove',e=>{
     currentY=e.clientY;
     if(!drag){if(Math.abs(e.clientX-startX)>8||Math.abs(e.clientY-startY)>8){clearTimeout(timer);timer=null}return}
     e.preventDefault();const r=drag.getBoundingClientRect();drag.style.left=dragLeft+'px';drag.style.top=(e.clientY-grabY)+'px';
     const rows=[...list.querySelectorAll('[data-route]')].filter(x=>x!==drag);const target=rows.find(x=>{const b=x.getBoundingClientRect();return e.clientY<b.top+b.height/2});
     if(target)list.insertBefore(placeholder,target);else list.appendChild(placeholder);
   },{passive:false});
   const finish=e=>{clearTimeout(timer);timer=null;if(!drag)return;try{handle.releasePointerCapture(pointerId)}catch(_){ }if(placeholder?.parentNode){placeholder.parentNode.insertBefore(drag,placeholder);placeholder.remove()}clearStyles(drag);placeholder?.remove();placeholder=null;const next=currentOrder();drag=null;stopAuto();document.body.style.overflow=initialBodyOverflow;Promise.resolve(onReorder(next)).catch(err=>{console.error(err);showToast('Impossibile salvare la sequenza dei reparti')});e?.preventDefault?.()};
   handle.addEventListener('pointerup',finish,{passive:false});handle.addEventListener('pointercancel',()=>cleanup(true));
 });
}

 const showManageModal=async()=>{

async function openCopyRoute(storeId,returnToManage=()=>openManageCategories(storeId)){
 const ss=(await allStoresSorted()).filter(s=>s.id!==storeId);
 if(!ss.length){showToast('Non ci sono altri supermercati da cui copiare.');return}
 modal('Copia configurazione da altro supermercato',`<div class="field" style="margin-bottom:28px"><label for="copyRouteStore">Copia configurazione da</label><span class="small muted">Verranno copiate sia i reparti sia il percorso di spesa dal supermercato selezionato.</span>${customDropdown('copyRouteStore',ss[0]?.id,ss,false,true)}</div>`,[
   {label:'Copia',class:'btn-primary',action:async()=>{const source=$('#copyRouteStore').value,routes=await getAll('storeCategoryRoutes'),chosen=routes.filter(r=>r.storeId===source).sort((a,b)=>a.position-b.position);if(routes.some(r=>r.storeId===storeId)&&!(await confirmDialog('Copia configurazione','La nuova configurazione sostituirà quella esistente. Continuare?','Continua',{closeButton:true,onClose:returnToManage})))return;const tx=db.transaction('storeCategoryRoutes','readwrite'),os=tx.objectStore('storeCategoryRoutes');for(const r of routes)if(r.storeId===storeId)os.delete(r.id);chosen.forEach((r,i)=>os.put({id:uuid(),storeId,categoryId:r.categoryId,position:i+1,needsPositioning:false}));await txDone(tx);closeModal(false);await returnToManage();showToast('Configurazione copiata')}},
   {label:'Annulla',class:'btn-plain',action:()=>closeModal()}
 ],{closeButton:true,onClose:returnToManage,alignTop:true});wireCustomDropdown('copyRouteStore');
}
async function deleteStore(storeId){
 const [routes,associations,prices,items,st]=await Promise.all([getAll('storeCategoryRoutes'),getAll('productStores'),getAll('productPrices'),getAll('shoppingListItems'),getOne('settings','main')]);
 const tx=db.transaction(['stores','storeCategoryRoutes','productStores','productPrices','shoppingListItems','settings','tombstones'],'readwrite');
 for(const x of routes)if(x.storeId===storeId)tx.objectStore('storeCategoryRoutes').delete(x.id);
 for(const x of associations)if(x.storeId===storeId)tx.objectStore('productStores').delete(x.id);
 for(const x of prices)if(x.storeId===storeId)tx.objectStore('productPrices').delete(x.id);
 for(const x of items)if(x.storeId===storeId){x.storeId=null;x.updatedAt=now();tx.objectStore('shoppingListItems').put(x)}
 if(st?.defaultStoreId===storeId)tx.objectStore('settings').put({...st,defaultStoreId:null});
 tx.objectStore('stores').delete(storeId);tx.objectStore('tombstones').put({id:uuid(),entityType:'store',entityId:storeId,deletedAt:now(),revision:Date.now()});
 await txDone(tx);selectedStore='all';selectedStores=['all'];localStorage.setItem('spesaSuMisura.selectedStores',JSON.stringify(selectedStores));renderStores();showToast('Supermercato eliminato');
}
async function renderOther(){
  $('#appMain').innerHTML=`<h1>Altro</h1><button class="other-opt" id="guideBtn"><span class="row-name">Guida</span><div class="row-sub">Come usare SpesaSuMisura</div></button><button class="other-opt" id="infoBtn"><span class="row-name">Informazioni</span><div class="row-sub">Versione ${APP_VERSION}</div></button>`;
  $('#guideBtn').onclick=()=>modal('Guida',`<div class="guide-text"><h3>FILOSOFIA</h3><p><em>Quando redigi la lista della spesa non sai mai quanto andrai a spendere e se rispetterai il budget?</em></p><p><em>Durante la spesa ti capita spesso di ritornare in un reparto già oltrepassato, perché la lista della spesa è disordinata?</em></p><p><em>Preferisci rifornirti in diversi supermercati/negozi, anche durante la stessa sessione di spesa?</em></p><p><strong>SpesaSuMisura</strong> è un vero e proprio Gestionale che crei e personalizzi secondo le tue reali necessità e secondo il tuo modo di fare la spesa.</p><h3>REPARTI</h3><p>Niente più categorie commerciali predefinite: i reparti li crei tu e secondo il grado di dettaglio che ti è più comodo (ad esempio puoi creare un unico reparto ORTOFRUTTA piuttosto che diversi sottoreparti, quali FRUTTA, VERDURA, ORTAGGI, VERDURE COTTE, SPEZIE AROMATICHE, ecc.).</p><h3>SUPERMERCATI</h3><p>Non tutti i supermercati hanno gli stessi reparti o i reparti posizionati secondo lo stesso percorso di spesa: qui puoi creare la reale configurazione di ogni tuo supermercato (tipo, numero di reparti e loro ordinamento sequenziale).</p><h3>ARTICOLI</h3><p>Quante volte capita che uno stesso articolo sia più conveniente acquistarlo in un supermercato piuttosto che in un altro?</p><p>Qui crei il database dei tuoi articoli: non solo la descrizione, ma anche la possibilità di abbinargli il prezzo di ogni tuo supermercato.</p><h3>LA MIA LISTA</h3><p>Gli articoli vengono raggruppati per supermercato ed ordinati secondo il percorso di spesa di ognuno.</p><p>I prezzi degli articoli possono essere aggiornati anche durante la spesa in corso, in modo da tenere sotto controllo quanto si è speso e quanto resta da spendere.</p><p>Dal menu a tre puntini accanto al titolo puoi salvare la lista con un nome, caricare una lista salvata, inizializzare la spesa o svuotare la lista.</p><h3>BACKUP</h3><p>Usa i due pulsanti in alto a destra per salvare un backup del file o per aprire un backup precedente.</p></div>`,[{label:'Chiudi',class:'btn-primary',action:closeModal}]);
  $('#infoBtn').onclick=()=>modal('Informazioni',`<div style="text-align:center;padding:12px"><div style="font-size:26px;font-weight:900">${APP_NAME}</div><p class="muted">La tua spesa, come la vuoi tu.</p><p>Versione ${APP_VERSION}</p><p class="small muted">I dati sono salvati localmente su questo dispositivo.</p></div>`,[{label:'Chiudi',class:'btn-primary',action:closeModal}]);
}
async function exportBackup(options={}){
 const data=await allData(),payload={format:'personal-shopping-assistant',formatVersion:1,appVersion:APP_VERSION,archiveId:(await getOne('meta','archiveId'))?.value||uuid(),exportedAt:now(),data};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
 const defaultName=options.suggestedName||`spesasumisura-backup-${new Date().toISOString().slice(0,10)}.json`;
 if(typeof window.showSaveFilePicker==='function'){
  try{
   const handle=await window.showSaveFilePicker({suggestedName:defaultName,types:[{description:'Backup SpesaSuMisura (JSON)',accept:{'application/json':['.json']}}]});
   const writable=await handle.createWritable();await writable.write(blob);await writable.close();showToast('Salvataggio eseguito');return true;
  }catch(e){if(e?.name==='AbortError')return false;showToast('Impossibile salvare il backup: '+(e?.message||'errore sconosciuto'));return false}
 }
 return await new Promise(resolve=>{
  let settled=false;const finish=value=>{if(!settled){settled=true;resolve(value)}};
  modal(options.title||'Salva backup con nome',`<p>Scegli il nome con cui salvare il backup dei tuoi dati.</p><div class="field"><label for="backupFileName">Nome del file</label><input id="backupFileName" type="text" maxlength="120" value="${esc(defaultName)}" autocomplete="off"></div><p class="small muted">Il browser gestisce la destinazione del download. Nei browser che non consentono l'accesso diretto ai file, l'app non può garantire la sovrascrittura di un file già esistente.</p>`,[
   {label:'Annulla',class:'btn-plain',action:()=>{closeModal(false);finish(false)}},
   {label:'Salva',class:'btn-primary',action:async()=>{
     let fileName=$('#backupFileName').value.trim().replace(/[\\/:*?"<>|]/g,'-');if(!fileName){showToast('Inserisci il nome del file.');return}if(!/\.json$/i.test(fileName))fileName+='.json';
     try{const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=fileName;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);closeModal(false);showToast('Salvataggio eseguito');finish(true)}catch(e){closeModal(false);showToast('Impossibile scaricare il backup: '+(e?.message||'errore sconosciuto'));finish(false)}
   }}
  ],{closeButton:true,onClose:()=>finish(false),alignTop:true});
 });
}
async function importBackup(file){
 try{
  const payload=JSON.parse(await file.text());
  if(payload.format!=='personal-shopping-assistant'||payload.formatVersion!==1||!payload.data)throw new Error('Formato backup non riconosciuto.');
  if(!Array.isArray(payload.data.savedLists))payload.data.savedLists=[];
  for(const name of stores){if(!Array.isArray(payload.data[name]))throw new Error('Il backup non contiene tutti gli archivi richiesti.')}
  const d=payload.data,counts=`<ul><li>${d.products.length} articoli</li><li>${d.stores.length} supermercati</li><li>${d.shoppingListItems.length} articoli nella lista</li></ul>`;
    const tx=db.transaction(stores,'readwrite');
  for(const name of stores){const os=tx.objectStore(name);os.clear();for(const item of d[name])os.put(item)}
  await txDone(tx);selectedStore='all';selectedStores=['all'];pageStack=[];localStorage.setItem('spesaSuMisura.selectedStores',JSON.stringify(selectedStores));page='list';window.scrollTo({top:0,behavior:'auto'});render();showToast('Backup ripristinato');
 }catch(e){showToast('Impossibile importare il backup: '+e.message)}
}
