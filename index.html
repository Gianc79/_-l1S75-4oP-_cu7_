.check-line label{flex:1}
.section-label{font-size:12px;font-weight:850;letter-spacing:.7px;color:var(--muted);margin:20px 2px 8px}
details.menu{position:relative}
details.menu summary{list-style:none;cursor:pointer;border-radius:12px;background:#eef3f0;width:42px;height:42px;display:grid;place-items:center;font-size:22px}

.modal-header{display:flex;align-items:center;gap:10px;margin:0 0 16px}.modal-header h2{margin:0;font-size:22px;line-height:1.2;flex:1}.modal-close{width:40px;height:40px;flex:0 0 40px;border:0;border-radius:11px;background:#eef2ef;color:var(--text);font-size:25px;line-height:1;display:grid;place-items:center}.modal-close:active{background:#dfe7e2}

.toast{position:fixed;z-index:50;left:50%;bottom:calc(145px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#17211e;color:white;padding:12px 16px;border-radius:12px;max-width:90%;box-shadow:var(--shadow);font-size:14px}
.hidden{display:none!important}
.money-celebration{text-align:center;padding:4px 0 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%}
.money-art{display:flex;justify-content:center;align-items:center;width:100%;margin:0 auto;line-height:1;animation:cartBounce .8s ease-in-out infinite alternate}.cart-art{width:150px;height:115px;display:inline-block}
.celebrate-title{font-size:26px;font-weight:900;color:var(--green);margin:10px 0 4px;text-align:center;width:100%}
.celebrate-sub{color:var(--muted);font-size:14px;line-height:1.4;text-align:center;width:100%}
@keyframes cartBounce{from{transform:translateY(2px)}to{transform:translateY(-5px)}}
@keyframes runnerMove{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(2px,-3px) rotate(-1deg)}}
@keyframes wheelSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes motionFade{0%,100%{opacity:.25;transform:translateX(0)}50%{opacity:1;transform:translateX(-5px)}}
.runner{transform-origin:70px 100px;animation:runnerMove .55s ease-in-out infinite}.cart{transform-origin:190px 110px;animation:cartBounce .55s ease-in-out infinite alternate}.motion-line{transform-origin:25px 55px;animation:motionFade .7s ease-in-out infinite}

/* v. 1.25 */
.shopping-list-row.checked .item-body{opacity:.45}
.sticky-list-footer.is-complete .counter{background:#159447;color:#fff}
/* v. 1.26 */
.floating-add-wrap{position:fixed;top:calc(58px + env(safe-area-inset-top));left:0;right:0;z-index:9;display:flex;justify-content:center;pointer-events:none;padding:6px 14px}
.floating-add-wrap.hidden{display:none!important}
.floating-add-btn{pointer-events:auto;max-width:760px;width:100%;box-shadow:0 6px 20px rgba(0,0,0,.28),0 2px 6px rgba(23,107,85,.35);border:1px solid rgba(255,255,255,.3)}
@media(min-width:620px){.floating-add-wrap{top:calc(64px + env(safe-area-inset-top))}}
.create-product-btn-square{width:46px;height:46px;min-width:46px;min-height:46px;border:1px solid #cbd6d0;border-radius:11px;background:#e8f4ef;color:var(--green-dark);display:grid;place-items:center;padding:0;flex:0 0 46px;cursor:pointer}
.create-product-btn-square:active{background:#d8ebe2;transform:scale(.96)}
.manual-amount-box input{text-align:right}

/* v. 1.27 */
.sticky-action-wrap{position:sticky;top:73px;z-index:8;background:var(--bg);padding:4px 0 6px}
@media(max-width:619px){.sticky-action-wrap{top:62px}}
.products-search-sticky{top:129px!important}
@media(max-width:619px){.products-search-sticky{top:118px!important}}
.add-search-row{display:flex!important;flex-direction:row!important;align-items:center;gap:8px;margin-bottom:12px}
.add-search-row .search-input{flex:1;min-width:0;width:auto}
.add-search-row .create-product-btn-square{flex:0 0 46px;width:46px;height:46px;border-radius:13px;background:linear-gradient(180deg,#fff,#eaf4ef);border:1.5px solid #a8c7b8;box-shadow:0 1px 3px rgba(15,60,45,.10);display:grid;place-items:center;cursor:pointer}
.add-search-row .create-product-btn-square:active{background:#d5eade;transform:scale(.95)}
#quickAmount{text-align:left!important;display:flex;align-items:center}
.manual-amount-box{display:flex;align-items:center;justify-content:space-between;gap:10px}
.manual-amount-box label{margin:0;white-space:nowrap}
.manual-input-wrap{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.manual-amount-box .name-box{width:110px;position:relative}
.manual-amount-box .name-box input{min-height:38px;height:38px;text-align:right;padding:6px 10px}
.manual-amount-box .name-box.dirty input{padding-right:64px}
.manual-amount-box .name-box button{width:28px;height:28px}
.manual-amount-box .name-box .name-ok{right:3px}
.manual-amount-box .name-box .name-no{right:33px}
.manual-amount-box .price-eur{font-weight:700}
</style>

async function saveProductForm(productId, returnPage, returnCategoryId = null) {

function bindCategoryDrag(list, onReorder) {
  list.querySelectorAll("[data-route]").forEach((row) => {
    const handle = row.querySelector("[data-drag-handle]");
    if (!handle) return;
    let timer = null, drag = null, placeholder = null, pointerId = null, startX = 0, startY = 0, currentY = 0, autoFrame = null, initialBodyOverflow = "", dragLeft = 0, grabY = 0;
    const panel = () => $("#modalRoot .modal");
    const stopAuto = () => {
      if (autoFrame !== null) {
        cancelAnimationFrame(autoFrame);
        autoFrame = null;
      }
    };
    const currentOrder = () => [...list.querySelectorAll("[data-route]")].map((x) => x.dataset.route);
    const clearStyles = (el) => {
      if (!el) return;
      el.classList.remove("dragging");
      for (const prop of ["position", "left", "top", "width", "height", "zIndex", "pointerEvents", "margin"]) el.style[prop] = "";
    };
    const cleanup = (restore) => {
      clearTimeout(timer);
      timer = null;
      stopAuto();
      if (drag && placeholder?.parentNode && restore) {
        placeholder.parentNode.insertBefore(drag, placeholder);
        placeholder.remove();
        onReorder(currentOrder());
      }
      clearStyles(drag);
      placeholder?.remove();
      placeholder = null;
      drag = null;
      document.body.style.overflow = initialBodyOverflow;
    };
    const autoScroll = () => {
      if (!drag) {
        autoFrame = null;
        return;
      }
      const p = panel();
      if (p) {
        const r = p.getBoundingClientRect(), edge = 70;
        let d = 0;
        if (currentY < r.top + edge) d = -Math.min(13, Math.max(2, (r.top + edge - currentY) / 3));
        else if (currentY > r.bottom - edge) d = Math.min(13, Math.max(2, (currentY - (r.bottom - edge)) / 3));
        if (d) p.scrollTop = Math.max(0, Math.min(p.scrollHeight - p.clientHeight, p.scrollTop + d));
      }
      autoFrame = requestAnimationFrame(autoScroll);
    };
    handle.addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return;
      startX = e.clientX;
      startY = currentY = e.clientY;
      pointerId = e.pointerId;
      try {
        handle.setPointerCapture(pointerId);
      } catch (_) {
      }
      clearTimeout(timer);
      timer = setTimeout(() => {
        if (!row.isConnected) return;
        drag = row;
        const r = row.getBoundingClientRect();
        dragLeft = r.left;
        grabY = currentY - r.top;
        placeholder = document.createElement("div");
        placeholder.className = "route-row placeholder";
        placeholder.style.height = r.height + "px";
        placeholder.style.marginBottom = getComputedStyle(row).marginBottom;
        row.parentNode.insertBefore(placeholder, row.nextSibling);
        try {
          handle.setPointerCapture(pointerId);
        } catch (_) {
        }
        row.style.width = r.width + "px";
        row.style.height = r.height + "px";
        row.style.margin = "0";
        row.style.position = "fixed";
        row.style.left = r.left + "px";
        row.style.top = r.top + "px";
        row.style.zIndex = "100";
        row.style.pointerEvents = "none";
        row.classList.add("dragging");
        initialBodyOverflow = document.body.style.overflow;
        document.body.style.overflow = "hidden";
        autoFrame = requestAnimationFrame(autoScroll);
      }, 180);
      e.preventDefault();
    }, { passive: false });
    handle.addEventListener("pointermove", (e) => {
      currentY = e.clientY;
      if (!drag) {
        if (Math.abs(e.clientX - startX) > 8 || Math.abs(e.clientY - startY) > 8) {
          clearTimeout(timer);
          timer = null;
        }
        return;
      }
      e.preventDefault();
      const r = drag.getBoundingClientRect();
      drag.style.left = dragLeft + "px";
      drag.style.top = e.clientY - grabY + "px";
      const rows = [...list.querySelectorAll("[data-route]")].filter((x) => x !== drag);
      const target = rows.find((x) => {
        const b = x.getBoundingClientRect();
        return e.clientY < b.top + b.height / 2;
      });
      if (target) list.insertBefore(placeholder, target);
      else list.appendChild(placeholder);
    }, { passive: false });
    const finish = (e) => {
      clearTimeout(timer);
      timer = null;
      if (!drag) return;
      try {
        handle.releasePointerCapture(pointerId);
      } catch (_) {
      }
      if (placeholder?.parentNode) {
        placeholder.parentNode.insertBefore(drag, placeholder);
        placeholder.remove();
      }
      clearStyles(drag);
      placeholder?.remove();
      placeholder = null;
      const next = currentOrder();
      drag = null;
      stopAuto();
      document.body.style.overflow = initialBodyOverflow;
      Promise.resolve(onReorder(next)).catch((err) => {
        console.error(err);
        showToast("Impossibile salvare la sequenza dei reparti");
      });
      e?.preventDefault?.();
    };
    handle.addEventListener("pointerup", finish, { passive: false });
    handle.addEventListener("pointercancel", () => cleanup(true));
  });
}

async function deleteStore(storeId) {
  const [routes, associations, prices, items, st] = await Promise.all([getAll("storeCategoryRoutes"), getAll("productStores"), getAll("productPrices"), getAll("shoppingListItems"), getOne("settings", "main")]);
  const tx = db.transaction(["stores", "storeCategoryRoutes", "productStores", "productPrices", "shoppingListItems", "settings", "tombstones"], "readwrite");
  for (const x of routes) if (x.storeId === storeId) tx.objectStore("storeCategoryRoutes").delete(x.id);
  for (const x of associations) if (x.storeId === storeId) tx.objectStore("productStores").delete(x.id);
  for (const x of prices) if (x.storeId === storeId) tx.objectStore("productPrices").delete(x.id);
  for (const x of items) if (x.storeId === storeId) {
    x.storeId = null;
    x.updatedAt = now();
    tx.objectStore("shoppingListItems").put(x);
  }
  if (st?.defaultStoreId === storeId) tx.objectStore("settings").put({ ...st, defaultStoreId: null });
  tx.objectStore("stores").delete(storeId);
  tx.objectStore("tombstones").put({ id: uuid(), entityType: "store", entityId: storeId, deletedAt: now(), revision: Date.now() });
  await txDone(tx);
  selectedStore = "all";
  selectedStores = ["all"];
  localStorage.setItem("spesaSuMisura.selectedStores", JSON.stringify(selectedStores));
  renderStores();
  showToast("Supermercato eliminato");
}

  $("#guideBtn").onclick = () => modal("Guida", `<div class="guide-text"><h3>FILOSOFIA</h3><p><em>Quando redigi la lista della spesa non sai mai quanto andrai a spendere e se rispetterai il budget?</em></p><p><em>Durante la spesa ti capita spesso di ritornare in un reparto gi\xE0 oltrepassato, perch\xE9 la lista della spesa \xE8 disordinata?</em></p><p><em>Preferisci rifornirti in diversi supermercati/negozi, anche durante la stessa sessione di spesa?</em></p><p><strong>SpesaSuMisura</strong> \xE8 un vero e proprio Gestionale che crei e personalizzi secondo le tue reali necessit\xE0 e secondo il tuo modo di fare la spesa.</p><h3>REPARTI</h3><p>Niente pi\xF9 categorie commerciali predefinite: i reparti li crei tu e secondo il grado di dettaglio che ti \xE8 pi\xF9 comodo (ad esempio puoi creare un unico reparto ORTOFRUTTA piuttosto che diversi sottoreparti, quali FRUTTA, VERDURA, ORTAGGI, VERDURE COTTE, SPEZIE AROMATICHE, ecc.).</p><h3>SUPERMERCATI</h3><p>Non tutti i supermercati hanno gli stessi reparti o i reparti posizionati secondo lo stesso percorso di spesa: qui puoi creare la reale configurazione di ogni tuo supermercato (tipo, numero di reparti e loro ordinamento sequenziale).</p><h3>ARTICOLI</h3><p>Quante volte capita che uno stesso articolo sia pi\xF9 conveniente acquistarlo in un supermercato piuttosto che in un altro?</p><p>Qui crei il database dei tuoi articoli: non solo la descrizione, ma anche la possibilit\xE0 di abbinargli il prezzo di ogni tuo supermercato.</p><h3>LA MIA LISTA</h3><p>Gli articoli vengono raggruppati per supermercato ed ordinati secondo il percorso di spesa di ognuno.</p><p>I prezzi degli articoli possono essere aggiornati anche durante la spesa in corso, in modo da tenere sotto controllo quanto si \xE8 speso e quanto resta da spendere.</p><p>Dal menu a tre puntini accanto al titolo puoi salvare la lista con un nome, caricare una lista salvata, inizializzare la spesa o svuotare la lista.</p><h3>BACKUP</h3><p>Usa i due pulsanti in alto a destra per salvare un backup del file o per aprire un backup precedente.</p></div>`, [{ label: "Chiudi", class: "btn-primary", action: closeModal }]);
  $("#infoBtn").onclick = () => modal("Informazioni", `<div style="text-align:center;padding:12px"><div style="font-size:26px;font-weight:900">${APP_NAME}</div><p class="muted">La tua spesa, come la vuoi tu.</p><p>Versione ${APP_VERSION}</p><p class="small muted">I dati sono salvati localmente su questo dispositivo.</p></div>`, [{ label: "Chiudi", class: "btn-primary", action: closeModal }]);
}
async function exportBackup(options = {}) {
  const data = await allData(), payload = { format: "personal-shopping-assistant", formatVersion: 1, appVersion: APP_VERSION, archiveId: (await getOne("meta", "archiveId"))?.value || uuid(), exportedAt: now(), data };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const defaultName = options.suggestedName || `spesasumisura-backup-${(/* @__PURE__ */ new Date()).toISOString().slice(0, 10)}.json`;
  if (typeof window.showSaveFilePicker === "function") {
    try {
      const handle = await window.showSaveFilePicker({ suggestedName: defaultName, types: [{ description: "Backup SpesaSuMisura (JSON)", accept: { "application/json": [".json"] } }] });
      const writable = await handle.createWritable();
      await writable.write(blob);
      await writable.close();
      showToast("Salvataggio eseguito");
      return true;
    } catch (e) {
      if (e?.name === "AbortError") return false;
      showToast("Impossibile salvare il backup: " + (e?.message || "errore sconosciuto"));
      return false;
    }
  }
  return await new Promise((resolve) => {
    let settled = false;
    const finish = (value) => {
      if (!settled) {
        settled = true;
        resolve(value);
      }
    };
    modal(options.title || "Salva backup con nome", `<p>Scegli il nome con cui salvare il backup dei tuoi dati.</p><div class="field"><label for="backupFileName">Nome del file</label><input id="backupFileName" type="text" maxlength="120" value="${esc(defaultName)}" autocomplete="off"></div><p class="small muted">Il browser gestisce la destinazione del download. Nei browser che non consentono l'accesso diretto ai file, l'app non pu\xF2 garantire la sovrascrittura di un file gi\xE0 esistente.</p>`, [
      { label: "Annulla", class: "btn-plain", action: () => {
        closeModal(false);
        finish(false);
      } },
      { label: "Salva", class: "btn-primary", action: async () => {
        let fileName = $("#backupFileName").value.trim().replace(/[\\/:*?"<>|]/g, "-");
        if (!fileName) {
          showToast("Inserisci il nome del file.");
          return;
        }
        if (!/\.json$/i.test(fileName)) fileName += ".json";
        try {
          const url = URL.createObjectURL(blob), a = document.createElement("a");
          a.href = url;
          a.download = fileName;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1e3);
          closeModal(false);
          showToast("Salvataggio eseguito");
          finish(true);
        } catch (e) {
          closeModal(false);
          showToast("Impossibile scaricare il backup: " + (e?.message || "errore sconosciuto"));
          finish(false);
        }
      } }
    ], { closeButton: true, onClose: () => finish(false), alignTop: true });
  });
}
async function importBackup(file) {
  try {
    const payload = JSON.parse(await file.text());
    if (payload.format !== "personal-shopping-assistant" || payload.formatVersion !== 1 || !payload.data) throw new Error("Formato backup non riconosciuto.");
    if (!Array.isArray(payload.data.savedLists)) payload.data.savedLists = [];
    for (const name of stores) {
      if (!Array.isArray(payload.data[name])) throw new Error("Il backup non contiene tutti gli archivi richiesti.");
    }
    const d = payload.data, counts = `<ul><li>${d.products.length} articoli</li><li>${d.stores.length} supermercati</li><li>${d.shoppingListItems.length} articoli nella lista</li></ul>`;
    const tx = db.transaction(stores, "readwrite");
    for (const name of stores) {
      const os = tx.objectStore(name);
      os.clear();
      for (const item of d[name]) os.put(item);
    }
    await txDone(tx);
    selectedStore = "all";
    selectedStores = ["all"];
    pageStack = [];
    localStorage.setItem("spesaSuMisura.selectedStores", JSON.stringify(selectedStores));
    page = "list";
    window.scrollTo({ top: 0, behavior: "auto" });
    render();
    showToast("Backup ripristinato");
  } catch (e) {
    showToast("Impossibile importare il backup: " + e.message);
  }
}
async function init() {
  try {
    db = await openDB();
    await activeList();
    if (!await getOne("settings", "main")) await putOne("settings", { id: "main", defaultStoreId: null, currency: "EUR" });
    await putOne("meta", { key: "schemaVersion", value: DB_VERSION });
  } catch (e) {
    $("#appMain").innerHTML = `<div class="empty"><strong>Impossibile aprire l'archivio locale.</strong><br>${esc(e.message)}<br>Prova ad aprire l'app con un browser aggiornato.</div>`;
    return;
  }
  const savedFilters = localStorage.getItem("spesaSuMisura.selectedStores");
  if (savedFilters) {
    try {
      selectedStores = JSON.parse(savedFilters);
    } catch (e) {
      selectedStores = ["all"];
    }
  } else {
    const oldFilter = localStorage.getItem("spesaSuMisura.selectedStore");
    selectedStores = oldFilter && oldFilter !== "all" ? [oldFilter] : ["all"];
  }
  document.querySelectorAll(".nav-btn").forEach((b) => b.addEventListener("click", () => {
    productsView.q = "";
    productsView.cat = "";
    productsView.store = "";
    catQuery = "";
    setPage(b.dataset.page);
  }));
  $("#saveBackupBtn").addEventListener("click", exportBackup);
  $("#infoHeaderBtn").addEventListener("click", () => setPage("other"));
  function scrollDropdownToSelected(menu) {
    const go = () => {
      const sel = menu.querySelector(".selected");
      if (!sel) return;
      const sw = menu.querySelector(".dd-search-wrap");
      menu.scrollTop = Math.max(0, sel.getBoundingClientRect().top - menu.getBoundingClientRect().top + menu.scrollTop - (sw ? sw.offsetHeight : 0) - 4);
    };
    go();
    setTimeout(go, 60);
    setTimeout(go, 200);
  }
  new MutationObserver((list) => {
    for (const m of list) {
      const el = m.target;
      if (el.classList && el.classList.contains("custom-dropdown-menu") && !el.hidden) scrollDropdownToSelected(el);
    }
  }).observe(document.body, { attributes: true, attributeFilter: ["hidden"], subtree: true });
  document.addEventListener("click", (e) => {
    const b = e.target.closest(".info-btn"), scope = b ? b.closest(".modal") || $("#appMain") : null;
    document.querySelectorAll(".info-pop").forEach((pp) => {
      if (b && scope.contains(pp)) pp.hidden = !pp.hidden;
      else if (!pp.contains(e.target)) pp.hidden = true;
    });
  });
  const globalInput = document.createElement("input");
  globalInput.type = "file";
  globalInput.accept = "application/json,.json";
  globalInput.className = "hidden";
  globalInput.id = "globalBackupFile";
  document.body.appendChild(globalInput);
  $("#openBackupBtn").addEventListener("click", () => globalInput.click());
  globalInput.addEventListener("change", (e) => {
    if (e.target.files[0]) importBackup(e.target.files[0]);
    e.target.value = "";
  });
  $("#productsTopBtn").addEventListener("click", () => {
    const modalEl = $("#modalRoot .modal");
    if (modalEl) modalEl.scrollTo({ top: 0, behavior: "smooth" });
    else window.scrollTo({ top: 0, behavior: "smooth" });
  });
  $("#floatingAddItemBtn")?.addEventListener("click", () => openAddItem());
  window.addEventListener("scroll", updateScrollTopButton, { passive: true });
  handleAppBack();
  const bt = $("#brandTitle");
  if (bt) bt.innerHTML = `SpesaSuMisura <span class="small muted">v. ${APP_VERSION}</span>`;
  await render();
}
function initApp() {
  init();
}


init();
